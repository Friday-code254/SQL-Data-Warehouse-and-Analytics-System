name: SQL warehouse CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Microsoft ODBC Driver 18
        run: |
          set -euo pipefail
          source /etc/os-release
          curl -fsSLo /tmp/packages-microsoft-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check project structure
        run: python .github/scripts/validate_project.py

      - name: Lint analytics SQL
        run: sqlfluff lint --dialect tsql --rules CP01,LT01,LT02,LT12 05_analytics

      - name: Run Python preflight unit tests
        run: python -m unittest discover -s 04_tests/unit -v

      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Dwh-Aa1!$(python -c 'import secrets; print(secrets.token_hex(18))')"
          echo "::add-mask::$password"
          echo "SQLSERVER_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name warehouse-ci \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$password" \
            -p 14330:1433 \
            -v "$GITHUB_WORKSPACE/01_datasets:/tmp/warehouse-datasets:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec warehouse-ci /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs warehouse-ci
            exit 1
          fi
          docker exec --user 0 warehouse-ci \
            /opt/mssql/bin/mssql-conf set bulkadmin.allowedpathslist "/tmp/warehouse-datasets"

      - name: Install warehouse schema
        run: >-
          docker exec -w /workspace warehouse-ci
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$SQLSERVER_PASSWORD" -C -b -i 00_setup/install.sql

      - name: Run full pipeline
        env:
          SQLSERVER_SERVER: localhost,14330
          SQLSERVER_DATABASE: DataWarehouse
          SQLSERVER_TRUSTED_CONNECTION: "no"
          SQLSERVER_USER: sa
          SQLSERVER_ENCRYPT: "yes"
          SQLSERVER_TRUST_CERTIFICATE: "yes"
          SQLSERVER_DATASET_ROOT: /tmp/warehouse-datasets
        run: python 03_scripts/etl/run_pipeline.py

      - name: Run smoke and analytics SQL
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd=(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQLSERVER_PASSWORD" -C -b -d DataWarehouse)
          docker exec -w /workspace warehouse-ci "${sqlcmd[@]}" -i 04_tests/smoke_test.sql
          for query in 05_analytics/*.sql; do
            echo "Executing $query"
            docker exec -w /workspace warehouse-ci "${sqlcmd[@]}" -i "$query" >/dev/null
          done

      - name: Verify SCD2 behavior
        run: >-
          docker exec -w /workspace warehouse-ci
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$SQLSERVER_PASSWORD" -C -b -d DataWarehouse
          -i 04_tests/integration/stable_keys_and_scd2.sql

      - name: Run snapshot replay and failure integration tests
        env:
          RUN_SQL_INTEGRATION: "1"
          SQLSERVER_SERVER: localhost,14330
          SQLSERVER_DATABASE: DataWarehouse
          SQLSERVER_TRUSTED_CONNECTION: "no"
          SQLSERVER_USER: sa
          SQLSERVER_ENCRYPT: "yes"
          SQLSERVER_TRUST_CERTIFICATE: "yes"
          SQLSERVER_DATASET_ROOT: /tmp/warehouse-datasets
          SQLSERVER_LOCAL_DATASET_ROOT: ${{ github.workspace }}/01_datasets
        run: python -m unittest discover -s 04_tests/integration -p "test_*.py" -v

      - name: Report SQL pipeline failure details
        if: failure()
        shell: bash
        run: |
          set +e
          docker exec warehouse-ci /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SQLSERVER_PASSWORD" -C -d DataWarehouse \
            -Q "SET NOCOUNT ON;
                SELECT TOP (3) run_id,status,error_number,error_procedure,error_line,error_summary
                FROM etl.pipeline_runs ORDER BY started_at DESC;
                SELECT TOP (12) run_id,layer,table_name,status,error_summary
                FROM etl.table_load_logs ORDER BY table_load_log_id DESC;
                SELECT TOP (20) run_id,layer,test_name,severity,outcome,actual_result,failure_reason
                FROM etl.data_quality_results ORDER BY result_id DESC;"

      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f warehouse-ci || true
